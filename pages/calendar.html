            <button onclick="alert('기능 준비 중입니다.')" class="w-8 h-8 rounded-full bg-[#4355b9]/10 text-[#4355b9] flex items-center justify-center hover:bg-[#4355b9]/20 transition-colors">

</main>

<nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-[#e4e9ed] px-4 py-3 z-50 flex justify-around items-center shadow-[0_-4px_20px_rgba(0,17,58,0.05)]">
  <a class="flex flex-col items-center gap-1 text-[#00113a]/40" href="./study-plan-wizard.html">

<script src="../assets/js/main.js"></script>
<script>
let currentDate = new Date();
let calendarData = null;
let shuffledScheduleMap = new Map();

let prevDays = [];
let currentDays = [];

document.addEventListener('DOMContentLoaded', async function() {
  requireLogin();

  await loadCalendarData();
  renderCalendar();

  document.getElementById('prev-month').addEventListener('click', previousMonth);
  document.getElementById('next-month').addEventListener('click', nextMonth);

  const consent = localStorage.getItem(GAMEIFY_CONSENT_KEY);
  if (consent === null) {
    //const agreed = showGameifyDisclaimer();
    const agreed = true
    localStorage.setItem(GAMEIFY_CONSENT_KEY, agreed ? 'true' : 'false');
  }

  if (isGameifyConsentGranted()) {
    // 첫 팝업은 빠르게(2~5초), 이후에는 15~20초 랜덤 반복.
    startEvasivePopupLoopWithQuickFirst(15000, 20000, 2000, 5000);
  }
});

window.addEventListener('beforeunload', () => {
  stopEvasivePopupLoop();
});

async function loadCalendarData() {
  try {
    const response = await getCalendar();
    calendarData = response.data;
    buildShuffledScheduleMap();
  } catch (error) {
    console.error('캘린더 조회 실패:', error);
    alert('캘린더 데이터를 불러올 수 없습니다.\n' + (error.message || '알 수 없는 오류'));
  }
}

function shuffleArray(list) {
  const cloned = list.slice();
  for (let i = cloned.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = cloned[i];
    cloned[i] = cloned[j];
    cloned[j] = temp;
  }
  return cloned;
}

// Option C: 새로고침마다 날짜-일정 매핑과 날짜 내 과목 순서를 모두 뒤섞어 표시한다.
function buildShuffledScheduleMap() {
  shuffledScheduleMap = new Map();

  const schedules = Array.isArray(calendarData?.schedules) ? calendarData.schedules : [];
  if (!schedules.length) {
    return;
  }

  const normalized = schedules.map(item => ({
    date: item.date,
    subjects: Array.isArray(item.subjects)
      ? item.subjects.map(subject => ({ ...subject }))
      : []
  }));

  const subjectGroups = shuffleArray(
    normalized.map(item => shuffleArray(item.subjects))
  );

  normalized.forEach((item, index) => {
    shuffledScheduleMap.set(item.date, {
      date: item.date,
      subjects: subjectGroups[index] || []
    });
  });
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
  document.getElementById('month-year').textContent = `${year}년 ${monthNames[month]}`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  const prevLastDate = new Date(year, month, 0).getDate();
  prevDays = [];
  for (let i = firstDay - 1; i >= 0; i--) {
    prevDays.push(prevLastDate - i);
  }

  currentDays = [];
  for (let i = 1; i <= lastDate; i++) {
    currentDays.push(i);
  }

  const nextDays = [];
  const totalCells = prevDays.length + currentDays.length;
  const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remainingCells; i++) {
    nextDays.push(i);
  }

  const calendarDaysEl = document.getElementById('calendar-days');
  calendarDaysEl.innerHTML = '';

  prevDays.forEach((day, index) => {
    calendarDaysEl.appendChild(createDayCell(day, 'prev', null, index));
  });

  currentDays.forEach((day, index) => {
    const dateStr = formatDate(new Date(year, month, day));
    const scheduleData = findScheduleByDate(dateStr);
    const cellIndex = prevDays.length + index;
    calendarDaysEl.appendChild(createDayCell(day, 'current', scheduleData, cellIndex));
  });

  nextDays.forEach((day, index) => {
    const cellIndex = prevDays.length + currentDays.length + index;
    calendarDaysEl.appendChild(createDayCell(day, 'next', null, cellIndex));
  });
}

function createDayCell(day, type, scheduleData, cellIndex) {
  const cell = document.createElement('div');
  const isCurrent = type === 'current';
  const isLastColumn = (cellIndex + 1) % 7 === 0;

  let classes = 'p-3 transition-colors group relative flex flex-col items-start gap-1 border-b border-[#e4e9ed]';
  if (!isLastColumn) {
    classes += ' border-r border-[#e4e9ed]';
  }

  if (isCurrent) {
    classes += ' hover:bg-[#f6fafe]';
    const today = new Date();
    if (
      day === today.getDate() &&
      currentDate.getMonth() === today.getMonth() &&
      currentDate.getFullYear() === today.getFullYear()
    ) {
      classes += ' bg-blue-50';
    }
  } else {
    classes += ' bg-[#f6fafe]/30';
  }

  cell.className = classes;

  const dateSpan = document.createElement('span');
  dateSpan.className = `text-sm font-bold ${isCurrent ? 'opacity-100' : 'opacity-30'} group-hover:opacity-100`;
  dateSpan.textContent = day;
  cell.appendChild(dateSpan);

  if (isCurrent && scheduleData && Array.isArray(scheduleData.subjects) && scheduleData.subjects.length > 0) {
    const subject = scheduleData.subjects[0];
    const priorityColor = getPriorityColor(subject.priority);

    const subjectEl = document.createElement('div');
    subjectEl.className = `w-full ${priorityColor} border-l-4 border-[#4355b9] px-2 py-1 mt-1 rounded-sm`;
    subjectEl.innerHTML = `<p class="text-[10px] font-bold truncate leading-tight">${subject.subject}</p>`;
    cell.appendChild(subjectEl);
  }

  return cell;
}

function findScheduleByDate(dateStr) {
  if (shuffledScheduleMap.has(dateStr)) {
    return shuffledScheduleMap.get(dateStr);
  }

  if (!calendarData || !Array.isArray(calendarData.schedules)) {
    return null;
  }

  return calendarData.schedules.find(item => item.date === dateStr) || null;
}

function previousMonth() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
}
</script>
</body>
