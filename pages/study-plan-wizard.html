<!DOCTYPE html>
<html class="light" lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Utopia Planner - Study Plan Wizard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="../assets/css/custom.css" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Public Sans", "sans-serif"],
            "body": ["Public Sans", "sans-serif"],
            "label": ["Public Sans", "sans-serif"],
            "manrope": ["Manrope", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    background: #4355b9;
    cursor: pointer;
    border-radius: 50%;
  }
</style>
</head>
<body class="bg-[#f6fafe] font-body text-[#00113a]">
<!-- TopNavBar -->
<nav class="bg-[#f6fafe]/70 dark:bg-[#00113a]/70 backdrop-blur-xl docked full-width top-0 z-50 fixed w-full">
  <div class="flex justify-between items-center w-full px-8 py-4 max-w-[1440px] mx-auto">
    <div class="flex items-center gap-8">
      <a href="../index.html" class="text-xl font-bold text-[#00113a] dark:text-[#f6fafe] uppercase tracking-widest font-manrope">Utopia Planner</a>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="window.location.href='./calendar.html'" class="bg-[#4355b9] text-white px-5 py-2 rounded-full text-sm font-bold scale-95 active:opacity-80 transition-all">캘린더 이동</button>
      <button onclick="logoutUser()" class="px-4 py-2 text-sm bg-slate-300 text-slate-700 rounded-full hover:bg-slate-400 transition">로그아웃</button>
    </div>
  </div>
  <div class="bg-[#e4e9ed] dark:bg-[#002366] h-[1px] opacity-20"></div>
</nav>
<!-- Main Content -->
<main class="pt-24 pb-12 px-8 min-h-screen">
  <div class="max-w-3xl mx-auto">
    <header class="mb-10 text-center">
      <h1 id="wizard-title" class="text-3xl font-extrabold tracking-tight text-[#00113a] mb-2 font-headline">Study Plan Wizard (1)</h1>
      <p class="text-[#00113a]/60 font-medium">합리적인 목표 설정을 위한 지능형 학습 설계기</p>
    </header>
    <!-- Input Card -->
    <div class="bg-white p-8 rounded-3xl shadow-[0_4px_20px_rgba(0,17,58,0.05)] border border-[#e4e9ed] relative">
      <div class="space-y-8">
        <div>
          <label for="subject-input" class="block text-sm font-bold text-[#00113a]/80 mb-3 ml-1 uppercase tracking-wider">SUBJECT (1)</label>
          <input id="subject-input" class="w-full px-5 py-4 rounded-2xl bg-[#f6fafe] border-transparent focus:border-[#4355b9] focus:ring-0 text-[#00113a] font-medium transition-all placeholder:text-[#00113a]/30" placeholder="예: 거시경제학, 현대 철학" type="text"/>
        </div>
        <div>
          <label for="exam-date-input" class="block text-sm font-bold text-[#00113a]/80 mb-3 ml-1">시험 예정일</label>
          <div class="relative">
            <input id="exam-date-input" class="w-full px-5 py-4 rounded-2xl bg-[#f6fafe] border-transparent focus:border-[#4355b9] focus:ring-0 text-[#00113a] font-medium transition-all" type="date"/>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-4 ml-1">
            <label for="difficulty-slider" class="text-sm font-bold text-[#00113a]/80">학습 난이도</label>
            <span class="difficulty-badge text-xs font-bold text-[#4355b9] bg-[#4355b9]/10 px-3 py-1 rounded-full">중급 (Intermediate)</span>
          </div>
          <input id="difficulty-slider" class="w-full h-2 bg-[#e4e9ed] rounded-lg appearance-none cursor-pointer accent-[#4355b9]" max="10" min="1" step="1" type="range" value="5"/>
          <div class="flex justify-between mt-2 text-[10px] text-[#00113a]/40 font-bold px-1">
            <span>MINIMAL</span>
            <span>CRITICAL</span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-[#00113a]/80 mb-3 ml-1">현재 이해도</label>
          <div class="grid grid-cols-3 gap-4">
            <button class="understanding-btn p-4 rounded-2xl border-2 border-[#4355b9] bg-[#4355b9]/5 text-[#4355b9] font-bold text-sm transition-all flex flex-col items-center gap-2" data-value="1">
              <span class="material-symbols-outlined">sentiment_neutral</span>
              입문자
            </button>
            <button class="understanding-btn p-4 rounded-2xl border-2 border-transparent bg-[#f6fafe] text-[#00113a]/50 font-bold text-sm hover:bg-[#e4e9ed] transition-all flex flex-col items-center gap-2" data-value="2">
              <span class="material-symbols-outlined">sentiment_satisfied</span>
              기초 수준
            </button>
            <button class="understanding-btn p-4 rounded-2xl border-2 border-transparent bg-[#f6fafe] text-[#00113a]/50 font-bold text-sm hover:bg-[#e4e9ed] transition-all flex flex-col items-center gap-2" data-value="3">
              <span class="material-symbols-outlined">psychology</span>
              심화 학습중
            </button>
          </div>
        </div>
        <div class="rounded-2xl border border-dashed border-[#cfd7e3] bg-[#f8fbff] px-4 py-3 text-sm text-[#00113a]/70 flex items-center justify-between">
          <span id="subject-step-label">과목 1 입력 중</span>
          <span id="subject-step-count" class="font-bold text-[#4355b9]">1 / 1</span>
        </div>
        <div>
          <h3 class="text-sm font-bold text-[#00113a]/80 mb-3 ml-1">입력된 과목 목록</h3>
          <div id="subject-summary" class="space-y-2"></div>
        </div>
        <div class="pt-4">
          <button id="generate-btn" class="w-full py-5 bg-[#4355b9] text-white rounded-2xl font-black text-lg shadow-lg shadow-[#4355b9]/20 hover:shadow-xl hover:translate-y-[-2px] active:scale-[0.98] transition-all">최적의 계획 생성</button>
        </div>
        <!-- Desktop Navigation Buttons -->
        <div class="flex flex-wrap items-center justify-end gap-3 pt-2">
          <button id="previous-step-btn" type="button" class="px-6 py-2.5 rounded-xl bg-[#f6fafe] text-[#00113a]/60 text-sm font-bold border border-[#e4e9ed] hover:bg-[#e4e9ed] transition-all">이전</button>
          <button id="next-step-btn" type="button" class="px-6 py-2.5 rounded-xl bg-[#f6fafe] text-[#00113a]/60 text-sm font-bold border border-[#e4e9ed] hover:bg-[#e4e9ed] transition-all">다음</button>
          <span id="subject-progress-badge" class="inline-flex items-center rounded-full border border-[#cbd5e1] bg-[#f8fbff] px-4 py-2 text-sm font-extrabold tracking-wide text-[#4355b9] shadow-sm">
            1 / 10
          </span>
          <button id="delete-step-btn" type="button" class="px-6 py-2.5 rounded-xl bg-red-50 text-red-600 text-sm font-bold border border-red-200 hover:bg-red-100 transition-all">과목 삭제</button>
          <button onclick="if(confirm('작성 중인 내용이 삭제됩니다. 계속하시겠습니까?')) window.location.href='../index.html'" class="px-6 py-2.5 rounded-xl bg-[#00113a] text-white text-sm font-bold hover:opacity-90 transition-all">취소</button>
        </div>
      </div>
    </div>
  </div>
</main>
<!-- Bottom Navigation for Mobile (Hidden on Desktop) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-[#e4e9ed] px-4 py-3 z-50 flex justify-around items-center shadow-[0_-4px_20px_rgba(0,17,58,0.05)]">
  <a class="flex flex-col items-center gap-1 text-[#4355b9] font-bold" href="./study-plan-wizard.html">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">timer</span>
    <span class="text-[10px]">Plan</span>
  </a>
  <a class="flex flex-col items-center gap-1 text-[#00113a]/40" href="./calendar.html">
    <span class="material-symbols-outlined">calendar_month</span>
    <span class="text-[10px]">Calendar</span>
  </a>
  <a class="flex flex-col items-center gap-1 text-[#00113a]/40" href="./stats.html">
    <span class="material-symbols-outlined">analytics</span>
    <span class="text-[10px]">Stats</span>
  </a>
  <a class="flex flex-col items-center gap-1 text-[#00113a]/40" href="./profile.html">
    <span class="material-symbols-outlined">person</span>
    <span class="text-[10px]">Profile</span>
  </a>
</nav>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/study-plan.js"></script>
</body>
</html>
